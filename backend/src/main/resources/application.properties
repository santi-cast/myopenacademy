spring.application.name=CodeAcademy
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# The local profile imports the human-supplied file; other profiles use environment configuration.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/${DB_NAME:code_academy}
spring.datasource.username=${DB_USERNAME:code_academy}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=code_academy
spring.flyway.enabled=true

# Content copies and manifests (content/<course>/manifest.json), relative to the backend working directory.
code-academy.content-dir=../content

# Strict JSON for every request body: a repeated key is malformed input, never "last one wins".
spring.jackson.read.strict-duplicate-detection=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
