# The academy's name for the logs and the startup notice; the interface takes it from frontend/src/brand/brand.json (H10).
spring.application.name=MyOpenAcademy
# H10: everything that changes between installations comes from the environment (.env.example explains each one).
# By default, only this machine: 127.0.0.1. In a container, or for the home network, APP_ADDRESS=0.0.0.0.
server.address=${APP_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8080}
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# The local profile imports the human-supplied file; other profiles use environment configuration.
# 5434 by default, so it never meets the 5433 of the original Code Academy.
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5434}/${DB_NAME:myopenacademy}
spring.datasource.username=${DB_USERNAME:myopenacademy}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=code_academy
spring.flyway.enabled=true
# Flyway's history always lives in public, where every existing database already keeps it. Left unset, Flyway would
# use PostgreSQL's current schema, and with a database user named code_academy (search_path "$user", public) that
# becomes the code_academy schema created by V1, so the second startup would find it without a history table.
# Migrations qualify every object with code_academy explicitly.
spring.flyway.default-schema=public

# Content copies and manifests (content/<course>/manifest.json), relative to the backend working directory.
code-academy.content-dir=${CONTENT_DIR:../content}
# The address people use to open the academy: shown when it starts, and checked to warn about plain HTTP on a network.
code-academy.public-url=${PUBLIC_URL:http://127.0.0.1:8080}
# The compiled frontend (frontend/dist) the backend serves itself: one origin, one port (H10). Empty in development,
# where Vite serves it.
code-academy.frontend-dir=${FRONTEND_DIR:}
# «Mis cursos» lists this course first and the others by title (author's decision, 16 November 2026).
code-academy.first-course=${CODE_ACADEMY_FIRST_COURSE:inicial}

# Strict JSON for every request body: a repeated key is malformed input, never "last one wins".
spring.jackson.read.strict-duplicate-detection=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
