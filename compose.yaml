name: myopenacademy

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-code_academy}
      POSTGRES_USER: ${DB_USERNAME:-code_academy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a nonempty DB_PASSWORD in your local environment}
    ports:
      # 5434 by default (DB_PORT), never the 5433 of the original Code Academy; only this machine.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      # PostgreSQL 18 stores versioned PGDATA beneath /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
